<rect x="252" y="214" width="42" height="40" rx="7" transform="rotate(10 273 234)" stroke="#7FB3B6" stroke-width="1.6"></rect>
<rect x="220" y="244" width="38" height="36" rx="7" transform="rotate(4 239 262)" stroke="#7FB3B6" stroke-width="1.6"></rect>
<path d="M296 176 C304 150 324 138 344 140 C336 154 322 170 300 184 Z" stroke="#A88A12" stroke-width="1.6"></path>
</g>
</svg>
