<circle cx="288" cy="290" r="2" fill="#FFFFFF"></circle>
<circle cx="230" cy="310" r="1.6" fill="#FFFFFF"></circle>
<path d="M296 176 C304 150 324 138 344 140 C336 154 322 170 300 184 Z" fill="#F2CF3A"></path>
<path d="M302 176 C312 160 326 150 338 146" fill="none" stroke="#FFF1A6" stroke-width="2.6" stroke-linecap="round"></path>
</g>

